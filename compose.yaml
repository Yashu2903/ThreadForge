# Local development PostgreSQL. Reads POSTGRES_* from the repo-root .env (see .env.example).
name: threadforge

services:
  postgres:
    # pgvector/pgvector is the official postgres:16 image plus the "vector" extension (AI retrieval)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadforge-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-threadforge}
    ports:
      # Bound to localhost only. Never publish a database on 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - threadforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis (a Pub/Sub live-notification hint; holds NO authoritative data, so no persistence).
  # ThreadForge's own instance on 127.0.0.1:6390: it does not touch any other Redis on the host.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The collaboration service (Hocuspocus). NOT published to the host: only the reverse proxy on the
  # compose network reaches it, at /collab on the same origin as the app. This repository does not yet
  # ship the proxy or an API container (the dev setup runs uvicorn and Vite on the host), so this
  # service is behind a profile:  docker compose --profile collab up -d --build collab
  # It reaches the API on the host through host.docker.internal; on a full deployment point
  # COLLAB_API_BASE_URL at the private API service instead. INTERNAL_API_SECRET must match the API's.
  collab:
    profiles: ["collab"]
    build:
      context: .
      dockerfile: collab/Dockerfile
    restart: unless-stopped
    environment:
      COLLAB_ADDRESS: "0.0.0.0"
      COLLAB_PORT: "4010"
      COLLAB_API_BASE_URL: ${COLLAB_API_BASE_URL:-http://host.docker.internal:8000}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      COLLAB_ALLOWED_ORIGINS: ${COLLAB_ALLOWED_ORIGINS:-http://localhost:5173}
      # room hints (optional; the periodic access check works without them)
      COLLAB_REDIS_URL: ${COLLAB_REDIS_URL:-}
      COLLAB_REDIS_PREFIX: ${REDIS_CHANNEL_PREFIX:-threadforge}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4010"

  # The AI worker (the only process that calls AI providers): runs the provider self-check and the
  # lazy-analysis queue. Behind a profile because AI is off until configured:
  #   docker compose --profile ai up -d --build ai-worker
  # It needs the SAME storage directory as the API: STORAGE_DIR on the host (default
  # ./backend/data/storage, where the dev API writes) is mounted at /data/storage. Provider keys and
  # AI_* settings come from the repo-root .env; only the addresses below are overridden so the
  # container reaches the compose database. The image contains Tesseract with English data.
  ai-worker:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-threadforge}:${POSTGRES_PASSWORD:-threadforge-dev-password}@postgres:5432/${POSTGRES_DB:-threadforge}
      STORAGE_PATH: /data/storage
      AI_ENABLED: ${AI_ENABLED:-false}
    volumes:
      - ${STORAGE_DIR:-./backend/data/storage}:/data/storage
    # the worker makes outbound calls to the providers and needs nothing else; it exposes no port

volumes:
  threadforge_pgdata:
