# Local development PostgreSQL. Reads POSTGRES_* from the repo-root .env (see .env.example).
name: threadforge

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadforge-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-threadforge}
    ports:
      # Bound to localhost only. Never publish a database on 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - threadforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis (a Pub/Sub live-notification hint; holds NO authoritative data, so no persistence).
  # ThreadForge's own instance on 127.0.0.1:6390: it does not touch any other Redis on the host.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  threadforge_pgdata:
