[project]
name = "threadforge-backend"
version = "0.1.0"
description = "ThreadForge backend: foundation and Google OIDC authentication (Part 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "authlib>=1.4",
    "httpx2>=2.16",
    "redis>=8.1.0",
    "websockets>=17.4",
    "pillow>=13.0.0",
    "cryptography>=50.0.2",
    "pypdfium2>=5.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "cryptography>=45",
    "pypdf>=7.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S603", "S607"]  # operator tool: runs docker/psql with a fixed argv
"app/ai/**" = ["E501"]
"app/models/analysis.py" = ["E501"]
"app/models/ai_request.py" = ["E501"]
"app/models/message.py" = ["E501"]
"app/models/room_event.py" = ["E501"]
"app/sources/**" = ["E501"]  # long prose lines in the design docstrings
"app/services/sources.py" = ["E501"]
"app/services/messages.py" = ["E501"]
"app/api/sources.py" = ["E501"]  # long prose lines in the design docstrings
"app/api/analysis.py" = ["E501"]
"app/api/ai_requests.py" = ["E501"]
"app/api/ai_proposals.py" = ["E501"]
"app/services/ai_proposals.py" = ["E501"]
"app/services/analysis.py" = ["E501"]
"app/services/ai_requests.py" = ["E501"]
"app/commands/ai_*.py" = ["E501", "S608"]
"app/commands/cleanup_ai.py" = ["E501"]
"app/commands/migrate_documents_to_collab.py" = ["E501"]
"app/workers/ai_worker.py" = ["E501"]
"app/ai/answer/**" = ["E501"]
"app/ai/usage.py" = ["E501", "S608"]  # f-string SQL built only from module constants
"migrations/versions/*.py" = ["E501"]  # long DDL strings and design notes
"migrations/versions/0010_ai_requests.py" = ["E501", "S608"]  # SQL built from module constants only
"scripts/e2e_ai_stub.py" = ["E501"]
"scripts/run_suite_in_batches.py" = ["E501"]
"tests/**" = ["S105", "S106", "S311", "S608", "E501"]
