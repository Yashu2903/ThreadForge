[project]
name = "threadforge-backend"
version = "0.1.0"
description = "ThreadForge backend: foundation and Google OIDC authentication (Part 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "authlib>=1.4",
    "httpx2>=2.16",
    "redis>=8.1.0",
    "websockets>=17.4",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "cryptography>=45",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S603", "S607"]  # operator tool: runs docker/psql with a fixed argv
"tests/**" = ["S105", "S106", "S311", "S608", "E501"]
